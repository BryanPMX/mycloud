---
services:
  api:
    build:
      context: "."
      dockerfile: Dockerfile.api
    env_file:
    - ".env"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      mailpit:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    ports:
    - 127.0.0.1:8080:8080
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    read_only: true
    pids_limit: 256
    cpus: "${API_CPUS:-1.0}"
    mem_limit: "${API_MEMORY_LIMIT:-512m}"
    tmpfs:
    - "/tmp:size=32m,mode=1777"
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q -O /dev/null http://127.0.0.1:9090/health/ready
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
  worker:
    build:
      context: "."
      dockerfile: Dockerfile.worker
    env_file:
    - ".env"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      clamav:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    read_only: true
    pids_limit: 256
    cpus: "${WORKER_CPUS:-1.0}"
    mem_limit: "${WORKER_MEMORY_LIMIT:-1536m}"
    tmpfs:
    - "/tmp:size=640m,mode=1777"
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q -O /dev/null http://127.0.0.1:9090/health/ready
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
  postgres:
    image: postgres:16-alpine
    env_file:
    - ".env"
    environment:
      POSTGRES_DB: mycloud
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
    - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -h 127.0.0.1 -U ${POSTGRES_USER} -d mycloud
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
    - 127.0.0.1:5432:5432
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    env_file:
    - ".env"
    healthcheck:
      test:
      - CMD
      - redis-cli
      - "-a"
      - "${REDIS_PASSWORD}"
      - ping
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
    - 127.0.0.1:6379:6379
    restart: unless-stopped
    volumes:
    - redis_data:/data
  minio:
    image: ghcr.io/bryanpmx/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    env_file:
    - ".env"
    environment:
      MINIO_ROOT_USER: "${MINIO_ACCESS_KEY}"
      MINIO_ROOT_PASSWORD: "${MINIO_SECRET_KEY}"
    volumes:
    - minio_data:/data
    ports:
    - 127.0.0.1:9000:9000
    - 127.0.0.1:9001:9001
    restart: unless-stopped
  mailpit:
    image: axllent/mailpit:v1.22
    ports:
    - 127.0.0.1:1025:1025
    - 127.0.0.1:8025:8025
    restart: unless-stopped
  clamav:
    image: clamav/clamav-debian:stable@sha256:76a9c3b63764b78178dc68fa7efcceca0cde2c8c9d4f925a8e697cb4511f8fdc
    volumes:
    - clamav_data:/var/lib/clamav
    restart: unless-stopped
    environment:
      CLAMD_CONF_StreamMaxLength: 512M
      CLAMD_CONF_MaxFileSize: 512M
      CLAMD_CONF_MaxScanSize: 768M
      CLAMD_CONF_AlertExceedsMax: 'yes'
      CLAMD_CONF_MaxThreads: '2'
      CLAMD_CONF_MaxQueue: '4'
      CLAMD_CONF_ConcurrentDatabaseReload: 'no'
    cpus: "${CLAMAV_CPUS:-1.0}"
    mem_limit: "${CLAMAV_MEMORY_LIMIT:-4g}"
  migrate:
    build:
      context: "."
      dockerfile: Dockerfile.migrate
    env_file:
    - ".env"
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
volumes:
  postgres_data:
  minio_data:
  clamav_data:
  redis_data:
