# Merge these jobs into the existing Prometheus config; do not replace other jobs.
global:
  scrape_interval: 15s
rule_files:
  - /etc/prometheus/mycloud-alerts.yml
scrape_configs:
  - job_name: mycloud-api
    static_configs:
      - targets: [127.0.0.1:19090]
  - job_name: mycloud-worker
    static_configs:
      - targets: [127.0.0.1:19091]
