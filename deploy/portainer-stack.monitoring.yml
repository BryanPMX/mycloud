# server-hp's existing Prometheus uses host networking. Publish metrics ONLY on
# loopback. The NPM primary file already has these bindings; this override
# remains useful with the generic primary file. No monitoring containers added.
services:
  api:
    ports: ["127.0.0.1:19090:9090"]
  worker:
    ports: ["127.0.0.1:19091:9090"]
