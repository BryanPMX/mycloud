---
services:
  api:
    image: ghcr.io/${GHCR_OWNER}/mycloud-api:${IMAGE_TAG:-latest}
    environment:
      APP_NAME: "${APP_NAME}"
      APP_ENV: "${APP_ENV}"
      APP_BASE_URL: "${APP_BASE_URL}"
      PORT: "${PORT}"
      DATABASE_URL: "${DATABASE_URL}"
      REDIS_URL: "${REDIS_URL}"
      MINIO_ENDPOINT: "${MINIO_ENDPOINT}"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY}"
      MINIO_SECURE: "${MINIO_SECURE}"
      MINIO_PUBLIC_ENDPOINT: "${MINIO_PUBLIC_ENDPOINT}"
      MINIO_PUBLIC_SECURE: "${MINIO_PUBLIC_SECURE}"
      MINIO_UPLOADS_BUCKET: "${MINIO_UPLOADS_BUCKET}"
      MINIO_ORIGINALS_BUCKET: "${MINIO_ORIGINALS_BUCKET}"
      MINIO_THUMBS_BUCKET: "${MINIO_THUMBS_BUCKET}"
      MINIO_AVATARS_BUCKET: "${MINIO_AVATARS_BUCKET}"
      CLAMAV_SOCKET: "${CLAMAV_SOCKET}"
      SMTP_HOST: "${SMTP_HOST}"
      SMTP_PORT: "${SMTP_PORT}"
      SMTP_USER: "${SMTP_USER}"
      SMTP_PASS: "${SMTP_PASS}"
      SMTP_FROM: "${SMTP_FROM}"
      JWT_SECRET: "${JWT_SECRET}"
      JWT_ISSUER: "${JWT_ISSUER}"
      JWT_ACCESS_TTL_MINUTES: "${JWT_ACCESS_TTL_MINUTES}"
      JWT_REFRESH_TTL_DAYS: "${JWT_REFRESH_TTL_DAYS}"
      CLEANUP_INTERVAL_MINUTES: "${CLEANUP_INTERVAL_MINUTES}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-https://mynube.live}"
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-}"
      MINIO_REGION: "${MINIO_REGION:-us-east-1}"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    ports:
    - 127.0.0.1:${API_BIND_PORT:-8080}:8080
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    read_only: true
    pids_limit: 256
    cpus: "${API_CPUS:-1.0}"
    mem_limit: "${API_MEMORY_LIMIT:-512m}"
    tmpfs:
    - "/tmp:size=32m,mode=1777"
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q -O /dev/null http://127.0.0.1:9090/health/ready
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
  worker:
    image: ghcr.io/${GHCR_OWNER}/mycloud-worker:${IMAGE_TAG:-latest}
    environment:
      APP_NAME: "${APP_NAME}"
      APP_ENV: "${APP_ENV}"
      PORT: "${PORT}"
      DATABASE_URL: "${DATABASE_URL}"
      REDIS_URL: "${REDIS_URL}"
      MINIO_ENDPOINT: "${MINIO_ENDPOINT}"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY}"
      MINIO_SECURE: "${MINIO_SECURE}"
      MINIO_PUBLIC_ENDPOINT: "${MINIO_PUBLIC_ENDPOINT}"
      MINIO_PUBLIC_SECURE: "${MINIO_PUBLIC_SECURE}"
      MINIO_UPLOADS_BUCKET: "${MINIO_UPLOADS_BUCKET}"
      MINIO_ORIGINALS_BUCKET: "${MINIO_ORIGINALS_BUCKET}"
      MINIO_THUMBS_BUCKET: "${MINIO_THUMBS_BUCKET}"
      MINIO_AVATARS_BUCKET: "${MINIO_AVATARS_BUCKET}"
      CLAMAV_SOCKET: "${CLAMAV_SOCKET}"
      SMTP_HOST: "${SMTP_HOST}"
      SMTP_PORT: "${SMTP_PORT}"
      SMTP_USER: "${SMTP_USER}"
      SMTP_PASS: "${SMTP_PASS}"
      SMTP_FROM: "${SMTP_FROM}"
      JWT_SECRET: "${JWT_SECRET}"
      JWT_ISSUER: "${JWT_ISSUER}"
      JWT_ACCESS_TTL_MINUTES: "${JWT_ACCESS_TTL_MINUTES}"
      JWT_REFRESH_TTL_DAYS: "${JWT_REFRESH_TTL_DAYS}"
      CLEANUP_INTERVAL_MINUTES: "${CLEANUP_INTERVAL_MINUTES}"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      clamav:
        condition: service_healthy
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    read_only: true
    pids_limit: 256
    cpus: "${WORKER_CPUS:-1.0}"
    mem_limit: "${WORKER_MEMORY_LIMIT:-1536m}"
    tmpfs:
    - "/tmp:size=640m,mode=1777"
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q -O /dev/null http://127.0.0.1:9090/health/ready
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
  migrate:
    cpus: "0.5"
    mem_limit: 256m
    pids_limit: 128
    image: ghcr.io/${GHCR_OWNER}/mycloud-migrate:${IMAGE_TAG:-latest}
    environment:
      DATABASE_URL: "${DATABASE_URL}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
  postgres:
    cpus: "${POSTGRES_CPUS:-1.0}"
    mem_limit: "${POSTGRES_MEMORY_LIMIT:-768m}"
    pids_limit: 512
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mycloud
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
    - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -h 127.0.0.1 -U ${POSTGRES_USER} -d mycloud
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  redis:
    cpus: "${REDIS_CPUS:-0.5}"
    mem_limit: "${REDIS_MEMORY_LIMIT:-512m}"
    pids_limit: 128
    image: redis:7-alpine
    environment:
      REDISCLI_AUTH: "${REDIS_PASSWORD}"
    command:
    - redis-server
    - "--requirepass"
    - "${REDIS_PASSWORD}"
    - "--appendonly"
    - 'yes'
    - '--maxmemory'
    - '${REDIS_MAXMEMORY:-128mb}'
    - '--maxmemory-policy'
    - noeviction
    volumes:
    - redis_data:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
  minio:
    cpus: "${MINIO_CPUS:-1.0}"
    mem_limit: "${MINIO_MEMORY_LIMIT:-1g}"
    pids_limit: 256
    image: ghcr.io/bryanpmx/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      GOMEMLIMIT: "${MINIO_GO_MEMORY_LIMIT:-768MiB}"
      MINIO_ROOT_USER: "${MINIO_ACCESS_KEY}"
      MINIO_ROOT_PASSWORD: "${MINIO_SECRET_KEY}"
      MINIO_BROWSER_REDIRECT_URL: "${MINIO_CONSOLE_REDIRECT_URL}"
    volumes:
    - minio_data:/data
    ports:
    - 127.0.0.1:${MINIO_BIND_PORT:-9000}:9000
    - 127.0.0.1:${MINIO_CONSOLE_BIND_PORT:-9001}:9001
    restart: unless-stopped
  clamav:
    image: clamav/clamav-debian:stable@sha256:76a9c3b63764b78178dc68fa7efcceca0cde2c8c9d4f925a8e697cb4511f8fdc
    volumes:
    - clamav_db:/var/lib/clamav
    restart: unless-stopped
    environment:
      CLAMD_CONF_StreamMaxLength: 512M
      CLAMD_CONF_MaxFileSize: 512M
      CLAMD_CONF_MaxScanSize: 768M
      CLAMD_CONF_AlertExceedsMax: 'yes'
      CLAMD_CONF_MaxThreads: '2'
      CLAMD_CONF_MaxQueue: '4'
      CLAMD_CONF_ConcurrentDatabaseReload: 'no'
    cpus: "${CLAMAV_CPUS:-1.0}"
    mem_limit: "${CLAMAV_MEMORY_LIMIT:-4g}"
volumes:
  postgres_data:
  redis_data:
  minio_data:
  clamav_db:
